<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Game Frame</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:#000}
    iframe{width:100%;height:100%;border:none;display:block;background:#000}
  </style>
</head>
<body>
  <iframe
    id="content-frame"
    sandbox="allow-scripts allow-same-origin allow-popups allow-pointer-lock allow-modals allow-forms"
    allow="autoplay; camera; microphone; clipboard-read; clipboard-write; gyroscope; accelerometer; fullscreen"
    scrolling="no"
  ></iframe>
  <script>
    var _gameUrl = '';
    var _requestedMuted = false;
    var _blobUrl = null;
    var _loadToken = 0;

    function contentFrame() {
      return document.getElementById('content-frame');
    }

    function isRemoteUrl(url) {
      return /^https?:\/\//i.test(url || '');
    }

    function isAbsoluteLocalUrl(url) {
      return /^(file|blob|data):/i.test(url || '');
    }

    function resolveLocalUrl(url) {
      if (!url) return 'about:blank';
      if (isAbsoluteLocalUrl(url) || isRemoteUrl(url)) return url;
      if (url.indexOf('assets/') === 0) return '../' + url;
      return url;
    }

    function revokeBlobUrl() {
      if (_blobUrl) {
        URL.revokeObjectURL(_blobUrl);
        _blobUrl = null;
      }
    }

    function postToParent(message) {
      window.parent.postMessage(message, '*');
    }

    function postToChild(message) {
      var frame = contentFrame();
      if (!frame || !frame.contentWindow) return;
      frame.contentWindow.postMessage(message, '*');
    }

    function patchLegacyAudioSession(html) {
      var functionPattern = /function\s+unlockAudioContext\s*\([^)]*\)\s*\{/g;
      var result = '';
      var lastIndex = 0;
      var match;

      while ((match = functionPattern.exec(html)) !== null) {
        result += html.slice(lastIndex, match.index);

        var functionHeaderEnd = match.index + match[0].length;
        var braceCount = 1;
        var i = functionHeaderEnd;

        while (i < html.length && braceCount > 0) {
          if (html[i] === '{') braceCount++;
          else if (html[i] === '}') braceCount--;
          i++;
        }

        var entireFunction = html.slice(match.index, i);
        var patchedFunction = entireFunction.replace(
          /((?:window\.)?(?:navigator\.)?audioSession\.type\s*=\s*)["']play-and-record["']/g,
          '$1"playback"'
        );

        result += patchedFunction;
        lastIndex = i;
      }

      result += html.slice(lastIndex);
      return result;
    }

    function buildInjectedScripts(initialAudioMuted) {
      var muted = initialAudioMuted ? 'true' : 'false';
      return [
        '<!-- sekai:online-scripts -->',
        '<script>',
        '(function(){function e(){var m=document.querySelector(\'meta[name="viewport"]\');if(!m){m=document.createElement(\'meta\');m.name=\'viewport\';document.head.insertBefore(m,document.head.firstChild)}m.content=\'width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no\'}document.readyState===\'loading\'?document.addEventListener(\'DOMContentLoaded\',e):e();})();',

        '(function(){var lt=0;document.addEventListener(\'touchstart\',function(){lt=Date.now()},{passive:true,capture:true});document.addEventListener(\'touchend\',function(){lt=Date.now()},{passive:true,capture:true});document.addEventListener(\'mousedown\',function(e){if(Date.now()-lt<200){var t=e.target;if(t.tagName===\'INPUT\'||t.tagName===\'TEXTAREA\'||t.isContentEditable)return;e.stopPropagation();e.preventDefault()}},{capture:true});var oA=EventTarget.prototype.addEventListener;EventTarget.prototype.addEventListener=function(t,fn,o){if(t===\'touchstart\'||t===\'touchmove\')return oA.call(this,t,fn,Object.assign({},o||{},{passive:true}));return oA.call(this,t,fn,o)}})();',
        '(function(){function s(msg){if(msg===null||msg===undefined)return \'\';if(typeof msg===\'string\')return msg;if(typeof msg===\'object\'){try{return JSON.stringify(msg);}catch(_e){return String(msg);}}return String(msg);}window.onerror=function(message,source,lineno,colno,error){window.parent.postMessage({type:\'sekai_iframe_js_error\',message:s(message),source:source||\'\',lineno:lineno||0,colno:colno||0,errorName:error?error.name:\'\',errorStack:error?error.stack:\'\'},\'*\');return false;};window.addEventListener(\'unhandledrejection\',function(event){var reason=event.reason;var isError=reason instanceof Error;window.parent.postMessage({type:\'sekai_iframe_js_error\',message:reason?s(reason):\'Unhandled promise rejection\',source:\'unhandledrejection\',lineno:0,colno:0,errorName:isError?reason.name:\'\',errorStack:isError?reason.stack:\'\'},\'*\');});})();',
        '(function(){var isMuted=' + muted + ',mutedEls=new WeakMap(),pendingResume=[],intendedPlaying=new Set(),ctxs=[];var oAC=window.AudioContext||window.webkitAudioContext;if(oAC){var P=function(){var c=new oAC();ctxs.push(c);if(isMuted)c.suspend().catch(function(){});return c};P.prototype=oAC.prototype;window.AudioContext=P;if(window.webkitAudioContext)window.webkitAudioContext=P}var aEls=[],oAudio=window.Audio;if(oAudio){window.Audio=function(s){var a=new oAudio(s);aEls.push(a);if(isMuted)a.muted=true;return a};window.Audio.prototype=oAudio.prototype}var vEls=[],oCE=document.createElement;document.createElement=function(tag){var el=oCE.call(document,tag);if(typeof tag===\'string\'){var t=tag.toLowerCase();if(t===\'audio\'){aEls.push(el);if(isMuted)el.muted=true}else if(t===\'video\'){vEls.push(el);if(isMuted)el.muted=true}}return el};if(window.HTMLMediaElement){var oP=HTMLMediaElement.prototype.play,oPa=HTMLMediaElement.prototype.pause;HTMLMediaElement.prototype.play=function(){intendedPlaying.add(this);if(isMuted&&!mutedEls.has(this)){mutedEls.set(this,this.muted);this.muted=true}return oP.apply(this,arguments)};HTMLMediaElement.prototype.pause=function(){intendedPlaying.delete(this);return oPa.apply(this,arguments)}}function muteAll(){if(isMuted)return;isMuted=true;pendingResume=[];ctxs.forEach(function(c){if(c&&c.state===\'running\')c.suspend().catch(function(){})});document.querySelectorAll(\'audio,video\').forEach(function(e){mutedEls.set(e,e.muted);e.muted=true});aEls.forEach(function(a){try{if(!mutedEls.has(a))mutedEls.set(a,a.muted);a.muted=true}catch(_){}});vEls.forEach(function(v){try{if(!mutedEls.has(v))mutedEls.set(v,v.muted);v.muted=true}catch(_){}})}function resumeCtx(){ctxs.forEach(function(c){if(c&&(c.state===\'suspended\'||c.state===\'interrupted\'))c.resume().catch(function(){})})}function unmuteAll(){if(!isMuted)return;isMuted=false;resumeCtx();document.querySelectorAll(\'audio,video\').forEach(function(e){var w=mutedEls.get(e);e.muted=w!==undefined?w:false});aEls.forEach(function(a){try{var w=mutedEls.get(a);a.muted=w!==undefined?w:false}catch(_){}});vEls.forEach(function(v){try{var w=mutedEls.get(v);v.muted=w!==undefined?w:false}catch(_){}});intendedPlaying.forEach(function(e){pendingResume.push(e)});pendingResume.forEach(function(e){try{if(e.paused)e.play().catch(function(){})}catch(_){}})}document.addEventListener(\'touchstart\',function(){if(isMuted)return;resumeCtx();if(!pendingResume.length)return;var t=pendingResume;pendingResume=[];t.forEach(function(e){try{if(!e.paused)return;e.play().catch(function(){pendingResume.push(e)})}catch(_){pendingResume.push(e)}})},{passive:true,capture:true});window.addEventListener(\'message\',function(ev){var d=ev.data;if(typeof d===\'string\'){try{d=JSON.parse(d)}catch(_){return}}if(!d)return;if(d.type===\'receive_audio_mute\'||(d.origin===\'sekai_gaming_iframe_api\'&&d.type===\'receive_audio_mute\'))muteAll();if(d.type===\'receive_audio_unmute\'||(d.origin===\'sekai_gaming_iframe_api\'&&d.type===\'receive_audio_unmute\'))unmuteAll()});window.addEventListener(\'DOMContentLoaded\',function(){window.parent.postMessage({origin:\'sekai_gaming_iframe_api\',type:\'sekai_iframe_dom_ready\'},\'*\')})})();',
        '(function(){var s=document.createElement(\'style\');s.textContent=\'html,body{overscroll-behavior:contain!important;height:100%!important;-webkit-user-select:none!important;user-select:none!important;touch-action:none!important;}\';document.head.appendChild(s);var st=null;function findScr(el){while(el&&el!==document.body&&el!==document.documentElement){var cs=window.getComputedStyle(el);if((cs.overflowY===\'auto\'||cs.overflowY===\'scroll\')&&el.scrollHeight>el.clientHeight)return el;el=el.parentElement}return null}document.addEventListener(\'touchstart\',function(e){st=e.touches.length===1?findScr(e.target):null;if(st)st.style.touchAction=\'pan-y\'},{passive:true,capture:true});document.addEventListener(\'touchend\',function(){if(st){st.style.touchAction=\'\';st=null}},{passive:true,capture:true});document.addEventListener(\'focusin\',function(e){var t=e.target;if(t.tagName===\'INPUT\'||t.tagName===\'TEXTAREA\'||t.isContentEditable)window.parent.postMessage({type:\'iframe-focusin\'},\'*\')},true);document.addEventListener(\'focusout\',function(e){var t=e.target,r=e.relatedTarget;if((t.tagName===\'INPUT\'||t.tagName===\'TEXTAREA\'||t.isContentEditable)&&!(r&&(r.tagName===\'INPUT\'||r.tagName===\'TEXTAREA\'||r.isContentEditable)))window.parent.postMessage({type:\'iframe-focusout\'},\'*\')},true)})();',
        '(function(){var vs=document.createElement(\'style\');vs.id=\'sekai-viewport-style\';document.head.appendChild(vs);var cur=null;function apply(h){if(h===cur)return;cur=h;if(typeof h===\'number\'&&h>0){vs.textContent=\':root{--sekai-viewport-height:\'+h+\'px}html{height:\'+h+\'px!important;overflow:hidden!important}body{height:\'+h+\'px!important;overflow:hidden!important}#game-container{height:\'+h+\'px!important}\';try{Object.defineProperty(window,\'innerHeight\',{get:function(){return h},configurable:true})}catch(_){}}else{vs.textContent=\':root{--sekai-viewport-height:100%}html{height:100%!important;overflow:hidden!important}body{height:100%!important;overflow:hidden!important}\'}}window.addEventListener(\'message\',function(e){if(e.data&&e.data.type===\'viewport_height_change\')apply(typeof e.data.height===\'number\'?e.data.height:null)});window.parent.postMessage({type:\'viewport_ready\'},\'*\')})();',

    }

    function injectScripts(html, options) {
      var patchedHtml = patchLegacyAudioSession(html || '');
      if (patchedHtml.indexOf('<!-- sekai:online-scripts -->') !== -1) {
        return patchedHtml;
      }

      var injectedScripts = buildInjectedScripts(options && options.initialAudioMuted === true);
      var headMatch = patchedHtml.match(/<head[^>]*>/i);
      if (headMatch) {
        var insertPos = (headMatch.index || 0) + headMatch[0].length;
        return patchedHtml.slice(0, insertPos) + injectedScripts + patchedHtml.slice(insertPos);
      }

      var htmlMatch = patchedHtml.match(/<html[^>]*>/i);
      if (htmlMatch) {
        var htmlPos = (htmlMatch.index || 0) + htmlMatch[0].length;
        return patchedHtml.slice(0, htmlPos) + '<head>' + injectedScripts + '</head>' + patchedHtml.slice(htmlPos);
      }

      return injectedScripts + patchedHtml;
    }

    function setFrameSource(source) {
      var frame = contentFrame();
      if (!frame) return;
      frame.src = source || 'about:blank';
    }

    async function loadRemoteHtml(url, token) {
      var response = await fetch(url, { cache: 'no-cache' });
      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }

      var fetchedHtml = await response.text();
      if (token !== _loadToken) {
        return;
      }

      var injectedHtml = injectScripts(fetchedHtml, {
        initialAudioMuted: _requestedMuted,
      });
      var blob = new Blob([injectedHtml], { type: 'text/html' });
      revokeBlobUrl();
      _blobUrl = URL.createObjectURL(blob);
      setFrameSource(_blobUrl);
    }

    async function loadGameContent(url) {
      var token = ++_loadToken;
      revokeBlobUrl();

      if (!url) {
        setFrameSource('about:blank');
        return;
      }

      if (isRemoteUrl(url)) {
        try {
          await loadRemoteHtml(url, token);
        } catch (error) {
          if (token !== _loadToken) return;
          setFrameSource('about:blank');
          postToParent({
            type: 'sekai_iframe_js_error',
            message: error && error.message ? error.message : 'load_remote_html_failed',
            source: 'g3_feed_game_frame',
            lineno: 0,
            colno: 0,
            errorName: error && error.name ? error.name : 'GameFrameLoadError',
            errorStack: error && error.stack ? error.stack : '',
          });
        }
        return;
      }

      setFrameSource(resolveLocalUrl(url));
    }

    function bootstrap(payload) {
      payload = payload || {};
      var nextUrl = payload.gameUrl || '';
      var urlChanged = nextUrl !== _gameUrl;

      _gameUrl = nextUrl;
      _requestedMuted = !!payload.isMuted;

      if (!urlChanged) return;

      loadGameContent(_gameUrl);
    }

    window.addEventListener('message', function(event) {
      var data = event.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch (_e) {}
      }

      var frame = contentFrame();

      if (frame && event.source === frame.contentWindow) {
        postToParent(data);
        return;
      }

      if (!data) return;

      if (data.type === 'sekai_feed_frame_bootstrap') {
        bootstrap(data.payload || {});
        return;
      }

      postToChild(data);
    });

    window.addEventListener('beforeunload', revokeBlobUrl);
  </script>
</body>
</html>
