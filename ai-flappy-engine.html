<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Flappy Engine Prototype</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; font-family: sans-serif; }
        canvas { display: block; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        #ui-layer { position: absolute; pointer-events: none; text-align: center; width: 100%; top: 15%; display: none; z-index: 10; }
        .dynamic-text { margin: 0; padding: 0; text-shadow: 3px 3px 6px rgba(0,0,0,0.8); white-space: pre-line; }
        #title-text { font-size: 32px; font-weight: bold; margin-bottom: 20px; }
        #score-text { font-size: 48px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <h1 id="title-text" class="dynamic-text">Tap to Start</h1>
        <h2 id="score-text" class="dynamic-text">0</h2>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // ==========================================
        // 1. THE AI INJECTED CONFIGURATION (SCHEMA)
        // ==========================================
        // This is exactly the format the Gemini API will generate! It dictates every single aspect of the game.
        const REMIX_CONFIG = {
            theme: {
                name: "Cyberpunk Hacker",
                backgroundColor: "#0d0221",  // Deep void purple
                groundColor: "#26c485",      // Hacker green
                obstacleColor: "#e01a4f",    // Laser red pipes
                textColor: "#26c485",        // Terminal text
                fontFamily: "'Courier New', Courier, monospace",
                bgElements: "1010101"        // Background details (e.g. binary rain or stars)
            },
            player: {
                emoji: "👾",                 // Pixel alien
                size: 45,
                hitboxScale: 0.6             // How forgiving the collision is
            },
            physics: {
                gravity: 0.6,                // Higher = falls faster
                jumpForce: -9,               // Lower = jumps higher (negative Y)
                gameSpeed: 3.5,              // Base speed of obstacles
                gapSize: 180                 // Space between top and bottom obstacles
            }
        };

        // If you want to test the incredible true power of this engine, try replacing the entire
        // REMIX_CONFIG block above with this 'Underwater' JSON manually locally and watch the game instantly change:
        /*
        const REMIX_CONFIG = {
            theme: { name: "Deep Ocean Explorer", backgroundColor: "#001a33", groundColor: "#ffcc00", obstacleColor: "#00ffcc", textColor: "#ffffff", fontFamily: "Arial, sans-serif", bgElements: "🫧" },
            player: { emoji: "🐠", size: 50, hitboxScale: 0.7 },
            physics: { gravity: 0.3, jumpForce: -6, gameSpeed: 2.0, gapSize: 220 } 
        };
        */

        // ==========================================
        // 2. THE GAME ENGINE CORE
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiLayer = document.getElementById('ui-layer');
        const titleText = document.getElementById('title-text');
        const scoreUI = document.getElementById('score-text');

        // Responsive sizing
        function resize() {
            canvas.width = Math.min(window.innerWidth, 400); // Standard mobile width
            canvas.height = window.innerHeight;
            applyTheme(); 
        }
        window.addEventListener('resize', resize);

        // Apply visual config
        function applyTheme() {
            titleText.style.color = REMIX_CONFIG.theme.textColor;
            titleText.style.fontFamily = REMIX_CONFIG.theme.fontFamily;
            scoreUI.style.color = REMIX_CONFIG.theme.textColor;
            scoreUI.style.fontFamily = REMIX_CONFIG.theme.fontFamily;
        }

        // Entity Definitions
        let player = { x: 50, y: 0, velocity: 0, width: REMIX_CONFIG.player.size, height: REMIX_CONFIG.player.size };
        let obstacles = [];
        let score = 0;
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let frameCount = 0;
        let currentSpeed = REMIX_CONFIG.physics.gameSpeed;
        
        function init() {
            resize();
            uiLayer.style.display = 'block';
            resetGame();
            gameLoop();
        }

        function resetGame() {
            player.y = canvas.height / 2;
            player.velocity = 0;
            obstacles = [];
            score = 0;
            frameCount = 0;
            currentSpeed = REMIX_CONFIG.physics.gameSpeed;
            titleText.innerText = REMIX_CONFIG.theme.name + "\n\nTap to Fly!";
            scoreUI.innerText = "";
        }

        function spawnObstacle() {
            const gap = REMIX_CONFIG.physics.gapSize;
            const minHeight = 50;
            const maxPos = canvas.height - gap - minHeight;
            const gapY = Math.floor(Math.random() * (maxPos - minHeight + 1)) + minHeight;
            
            obstacles.push({
                x: canvas.width,
                gapY: gapY,
                passed: false,
                width: 60
            });
        }

        function jump() {
            if (gameState === 'START') {
                gameState = 'PLAYING';
                titleText.innerText = "";
                scoreUI.innerText = "0";
            }
            if (gameState === 'PLAYING') {
                player.velocity = REMIX_CONFIG.physics.jumpForce;
            }
            if (gameState === 'GAMEOVER') {
                resetGame();
                gameState = 'START';
            }
        }

        // Action listeners
        window.addEventListener('click', jump);
        window.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, {passive: false});
        window.addEventListener('keydown', (e) => { if(e.code === 'Space') jump(); });

        // Physics Logic
        function update() {
            if (gameState !== 'PLAYING') return;

            // Apply specific JSON config Gravity
            player.velocity += REMIX_CONFIG.physics.gravity;
            player.y += player.velocity;

            // Death collision 
            if (player.y + player.height > canvas.height || player.y < 0) {
                gameOver();
            }

            // Game Pacing
            frameCount++;
            if (frameCount % Math.floor(100 * (3.5 / currentSpeed)) === 0) {
                spawnObstacle();
            }

            // Hitboxes controlled by the AI Config
            const hitboxMargin = player.width * ((1 - REMIX_CONFIG.player.hitboxScale) / 2);
            const playerBox = {
                x: player.x + hitboxMargin,
                y: player.y + hitboxMargin,
                w: player.width - (hitboxMargin*2),
                h: player.height - (hitboxMargin*2)
            };

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= currentSpeed;

                // Hit pipes
                if (playerBox.x < obs.x + obs.width && playerBox.x + playerBox.w > obs.x) {
                    if (playerBox.y < obs.gapY || playerBox.y + playerBox.h > obs.gapY + REMIX_CONFIG.physics.gapSize) {
                        gameOver();
                    }
                }

                // Point scored
                if (obs.x + obs.width < player.x && !obs.passed) {
                    score++;
                    scoreUI.innerText = score;
                    obs.passed = true;
                    // Escalate difficulty gracefully 
                    currentSpeed += 0.05; 
                }

                // Despawn
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            titleText.innerText = "CRASHED!\nScore: " + score;
            scoreUI.innerText = "Tap to restart";
        }

        // Draw Engine 
        function draw() {
            // Background
            ctx.fillStyle = REMIX_CONFIG.theme.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Procedural Background Elements (Binary string loop from Config)
            ctx.fillStyle = REMIX_CONFIG.theme.textColor;
            ctx.globalAlpha = 0.1;
            ctx.font = "20px " + REMIX_CONFIG.theme.fontFamily;
            for(let i=0; i<6; i++) {
                ctx.fillText(REMIX_CONFIG.theme.bgElements, ((frameCount * 0.3) + i*150) % canvas.width, (i * 120) % canvas.height);
            }
            ctx.globalAlpha = 1.0;

            if (gameState === 'START') {
                 ctx.font = REMIX_CONFIG.player.size + "px Arial";
                 ctx.fillText(REMIX_CONFIG.player.emoji, player.x, player.y + Math.sin(Date.now() / 200) * 10); // Float
                 return;
            }

            // Pipes
            ctx.fillStyle = REMIX_CONFIG.theme.obstacleColor;
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, 0, obs.width, obs.gapY);
                ctx.fillRect(obs.x, obs.gapY + REMIX_CONFIG.physics.gapSize, obs.width, canvas.height);
                // Fun pipe caps
                ctx.fillRect(obs.x - 5, obs.gapY - 20, obs.width + 10, 20);
                ctx.fillRect(obs.x - 5, obs.gapY + REMIX_CONFIG.physics.gapSize, obs.width + 10, 20);
            }

            // Player Emoji (Supports rotation based on fall velocity!)
            ctx.font = REMIX_CONFIG.player.size + "px Arial";
            ctx.textBaseline = "top";
            ctx.save();
            ctx.translate(player.x + player.width/2, player.y + player.height/2);
            ctx.rotate(Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (player.velocity * 0.1))));
            ctx.fillText(REMIX_CONFIG.player.emoji, -player.width/2, -player.height/2);
            ctx.restore();
            
            // Neon Ground
            ctx.fillStyle = REMIX_CONFIG.theme.groundColor;
            ctx.fillRect(0, canvas.height - 10, canvas.width, 10);
        }

        // Loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        init();
    </script>
</body>
</html>
