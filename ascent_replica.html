<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ascent of the Brave Replica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.55.2/phaser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        body { margin:0; overflow:hidden; background: #E6EAE8; touch-action: none;}
        #score-ui { 
            position: absolute; top: 40px; left: 40px; 
            font-family: 'Fredoka One', cursive; font-size: 60px; color: white; 
            -webkit-text-stroke: 4px black; text-shadow: 4px 4px 0 #000; 
            pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="score-ui">0</div>
    <div id="game-container"></div>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            backgroundColor: '#E6EAE8', // Exact off-white/gray from the screenshot
            physics: { default: 'arcade', arcade: { gravity: { y: 1500 }, debug: false } },
            scene: { create, update }
        };

        new Phaser.Game(config);
        
        let player, pillars, score = 0, isGameOver = false, scoreText;
        const GAP = 250; 
        const PILLAR_SPEED = -250;

        function create() {
            score = 0;
            isGameOver = false;
            document.getElementById('score-ui').innerText = '0';

            // 1. Procedural Background Vibe (Light Vertical Lines)
            const bgGfx = this.make.graphics();
            bgGfx.lineStyle(2, 0x000000, 0.05); // Super faint lines
            for(let i=0; i<window.innerWidth + 200; i+=80) {
                bgGfx.moveTo(i, 0); 
                bgGfx.lineTo(i, window.innerHeight);
            }
            bgGfx.strokePath();
            bgGfx.generateTexture('bgLines', window.innerWidth + 200, window.innerHeight);
            bgGfx.destroy();
            this.bg = this.add.tileSprite(window.innerWidth/2, window.innerHeight/2, window.innerWidth+200, window.innerHeight, 'bgLines');

            // 2. Procedural Player Graphic (Black Star with White/Red accents)
            const starGfx = this.make.graphics();
            starGfx.fillStyle(0x000000, 1); // Thick black outer
            drawStar(starGfx, 40, 40, 5, 30, 15);
            starGfx.fillPath();
            starGfx.fillStyle(0xFFFFFF, 1); // White inner outline
            drawStar(starGfx, 40, 40, 5, 20, 10);
            starGfx.fillPath();
            starGfx.fillStyle(0xED254E, 1); // Red center
            drawStar(starGfx, 40, 40, 5, 10, 5);
            starGfx.fillPath();
            starGfx.generateTexture('star', 80, 80);
            starGfx.destroy();

            // 3. Procedural Pillar Graphic (Red rectangle, thick black border, black stripes)
            const pGfx = this.make.graphics();
            // Black Outer Border
            pGfx.fillStyle(0x000000);
            pGfx.fillRect(0, 0, 120, 800);
            // Red Inner
            pGfx.fillStyle(0xED254E);
            pGfx.fillRect(8, 8, 104, 784);
            // Black Diagonal Stripes
            pGfx.lineStyle(12, 0x000000, 1);
            for(let y=0; y<900; y+=40) {
                pGfx.moveTo(8, y+30);
                pGfx.lineTo(112, y-30);
            }
            pGfx.strokePath();
            // Thicken border again over stripes to keep it clean
            pGfx.lineStyle(16, 0x000000, 1);
            pGfx.strokeRect(0, 0, 120, 800);
            pGfx.generateTexture('pillar', 120, 800);
            pGfx.destroy();

            // Setup Game Logic
            player = this.physics.add.sprite(window.innerWidth * 0.3, window.innerHeight / 2, 'star');
            player.setCollideWorldBounds(true);
            player.body.setSize(50, 50); // custom hitbox

            pillars = this.physics.add.group({ allowGravity: false });

            // Spawn initial pillars
            spawnPillar(this, window.innerWidth);
            spawnPillar(this, window.innerWidth + 400);
            spawnPillar(this, window.innerWidth + 800);

            // Inputs
            this.input.on('pointerdown', () => {
                if (isGameOver) { this.scene.restart(); return; }
                player.setVelocityY(-600);
                this.tweens.add({ targets: player, angle: -30, duration: 150, ease: 'Power2' });
            });
        }

        function update() {
            if (isGameOver) return;

            // Parallax bg scrolling
            this.bg.tilePositionX += 1;

            // Rotate player downwards over time
            if (player.angle < 60) player.angle += 2;

            pillars.getChildren().forEach(p => {
                // Pass pillar logic (Score)
                if (p.x < player.x && !p.passed && p.isTop) {
                    p.passed = true;
                    score++;
                    document.getElementById('score-ui').innerText = score;
                }
                // Respawn pillars seamlessly
                if (p.x < -100) {
                    if(p.isTop) spawnPillar(this, window.innerWidth + 300); // Only trigger next spawn on top pillar removal
                    p.destroy();
                }
            });

            // Collisions
            if (player.y >= window.innerHeight - 40 || player.y <= 40) die();
            this.physics.add.overlap(player, pillars, die, null, this);
        }

        function spawnPillar(scene, xPos) {
            let yCenter = Phaser.Math.Between(window.innerHeight * 0.3, window.innerHeight * 0.7);
            
            let topPillar = pillars.create(xPos, yCenter - GAP/2 - 400, 'pillar');
            topPillar.setVelocityX(PILLAR_SPEED);
            topPillar.isTop = true;
            topPillar.passed = false;
            
            let botPillar = pillars.create(xPos, yCenter + GAP/2 + 400, 'pillar');
            botPillar.setVelocityX(PILLAR_SPEED);
            botPillar.isTop = false;
        }

        function die() {
            isGameOver = true;
            player.setVelocityY(0);
            player.body.gravity.y = 0;
            pillars.getChildren().forEach(p => p.setVelocityX(0));
            document.getElementById('score-ui').innerHTML += '<br><span style="font-size:30px;color:red;">TAP TO RESTART</span>';
        }

        function drawStar(gfx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx, y = cy, step = Math.PI / spikes;
            gfx.beginPath();
            gfx.moveTo(cx, cy - outerRadius);
            for(let i=0; i<spikes; i++){
                x = cx + Math.cos(rot) * outerRadius; y = cy + Math.sin(rot) * outerRadius;
                gfx.lineTo(x, y); rot += step;
                x = cx + Math.cos(rot) * innerRadius; y = cy + Math.sin(rot) * innerRadius;
                gfx.lineTo(x, y); rot += step;
            }
            gfx.lineTo(cx, cy - outerRadius);
            gfx.closePath();
        }
    </script>
</body>
</html>
