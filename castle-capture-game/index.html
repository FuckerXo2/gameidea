<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle Capture - Medieval Strategy Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            overflow: hidden;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: auto;
        }
        
        .player-info {
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 2px solid #ffd700;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 15px;
            color: white;
            pointer-events: auto;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-overlay">
            <div id="hud">
                <div class="player-info">
                    <div>Player 1 (Blue)</div>
                    <div>Castles: <span id="p1-castles">1</span></div>
                    <div>Units: <span id="p1-units">5</span></div>
                </div>
                <div class="player-info" style="border-color: #ff4444;">
                    <div>Player 2 (Red)</div>
                    <div>Castles: <span id="p2-castles">1</span></div>
                    <div>Units: <span id="p2-units">5</span></div>
                </div>
            </div>
            
            <div id="controls">
                <div style="margin-bottom: 10px;">
                    <strong>Controls:</strong> Click to select units | Right-click to move | WASD to rotate camera
                </div>
                <button id="end-turn">End Turn</button>
                <button id="spawn-unit">Spawn Unit (Cost: 2)</button>
                <button id="restart">Restart Game</button>
            </div>
        </div>
        
        <div id="loading">
            <div class="spinner"></div>
            <div>Loading Castle Capture...</div>
            <div style="font-size: 14px; margin-top: 10px;">
                Note: Download 3D assets first (see ASSETS_GUIDE.md)
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/game.js"></script>
</body>
</html>
