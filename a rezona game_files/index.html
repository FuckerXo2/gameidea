<script>
/**
 * L0 System Invariants & Architecture
 */
let cw = 0, ch = 0;
let initialized = false;
let gameState = 'PLAYING'; // PLAYING | GAMEOVER
let lastTime = 0;
let score = 0;

// Entities
let player = { x: 0, y: 0, r: 25, targetX: 0, targetY: 0 };
let priest = { x: 0, y: 0, r: 30, speedMult: 1 };
let tv = { x: 0, y: 0, w: 60, h: 45, active: false };

// Config & DOM
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const dpr = window.devicePixelRatio || 1;

const uiHud = document.getElementById('hud');
const uiGameOver = document.getElementById('game-over-screen');
const scoreDisplay = document.getElementById('score-display');
const finalScore = document.getElementById('final-score');
const jumpscareBg = document.getElementById('jumpscare-bg');

// Media Elements
const imgMeme = document.getElementById('img_meme');
const imgPriest = document.getElementById('img_priest');
const imgBoy = document.getElementById('img_boy');
const vidTele = document.getElementById('vid_tele');
const bgmMain = document.getElementById('bgm_main');

window.gameConfig = {};

/**
 * Audio System (Strict L0 & L1/L2)
 */
const AudioSys = {
    ctx: null,
    buffers: {},
    unlocked: false,
    
    init() {
        try {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.loadSfx('door', document.getElementById('sfx_door').src);
        } catch (e) { console.warn("AudioContext failed", e); }
    },
    
    async loadSfx(id, url) {
        if (!this.ctx || !url) return;
        try {
            const res = await fetch(url);
            const arrayBuffer = await res.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) { console.warn(`SFX load failed: ${id}`); }
    },
    
    playSfx(id) {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        
        if (this.buffers[id]) {
            const source = this.ctx.createBufferSource();
            source.buffer = this.buffers[id];
            source.connect(this.ctx.destination);
            source.start();
        } else {
            this.synthesizeFallback();
        }
    },
    
    synthesizeFallback() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    },

    playJumpscareSynth() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(400, this.ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 1.5);
    },

    unlock() {
        if (this.unlocked) return;
        this.unlocked = true;
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        bgmMain.play().catch(()=>{});
        vidTele.muted = false;
        vidTele.play().catch(()=>{});
    }
};

function vibrate(style = 'light') {
    try {
        window.webkit?.messageHandlers?.rezonaBridge?.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
            params: { style }
        });
    } catch(e){}
}

/**
 * State Management
 */
function setState(newState) {
    gameState = newState;
    if (newState === 'PLAYING') {
        uiHud.classList.remove('hidden');
        uiGameOver.classList.add('hidden');
        jumpscareBg.classList.remove('animate-jumpscare');
        jumpscareBg.style.opacity = '0';
    } else if (newState === 'GAMEOVER') {
        uiHud.classList.add('hidden');
        uiGameOver.classList.remove('hidden');
        finalScore.innerText = score;
        
        // Jumpscare execution
        if (imgMeme && imgMeme.src) {
            jumpscareBg.style.backgroundImage = `url(${imgMeme.src})`;
            jumpscareBg.classList.add('animate-jumpscare');
            setTimeout(() => { jumpscareBg.style.opacity = '0.2'; }, 500);
        }
        AudioSys.playJumpscareSynth();
        vibrate('heavy');
    }
}

/**
 * Game Logic
 */
function spawnTV() {
    const margin = 50;
    tv.x = margin + Math.random() * (cw - margin * 2);
    tv.y = margin + Math.random() * (ch - margin * 2);
    tv.active = true;
}

function initGame() {
    score = 0;
    scoreDisplay.innerText = score;
    
    player.x = cw / 2;
    player.y = ch / 2;
    player.targetX = player.x;
    player.targetY = player.y;
    
    // Spawn priest far away
    priest.x = cw < ch ? cw / 2 : -100;
    priest.y = cw < ch ? -100 : ch / 2;
    priest.speedMult = 1;
    
    spawnTV();
    
    bgmMain.play().catch(()=>{});
    vidTele.muted = false;
    vidTele.play().catch(()=>{});
}

function restartGame() {
    initGame();
    setState('PLAYING');
}

/**
 * Core Loop
 */
function update(dt) {
    if (gameState !== 'PLAYING') return;

    // Entity Validity Check (L0)
    if (!isFinite(player.x) || !isFinite(player.y)) { player.x = cw/2; player.y = ch/2; }
    if (!isFinite(priest.x) || !isFinite(priest.y)) { priest.x = 0; priest.y = 0; }

    // Player Movement (Interpolate towards target)
    let dx = player.targetX - player.x;
    let dy = player.targetY - player.y;
    let dist = Math.hypot(dx, dy);
    
    if (dist > 2) {
        let moveDist = Math.min(dist, window.gameConfig.heroSpeed * dt * 60);
        player.x += (dx / dist) * moveDist;
        player.y += (dy / dist) * moveDist;
    }
    
    // Clamp Player
    player.x = Math.max(player.r, Math.min(cw - player.r, player.x));
    player.y = Math.max(player.r, Math.min(ch - player.r, player.y));

    // Priest Movement (Chases player)
    let pdx = player.x - priest.x;
    let pdy = player.y - priest.y;
    let pdist = Math.hypot(pdx, pdy);
    
    if (pdist > 0) {
        let currentPriestSpeed = window.gameConfig.priestBaseSpeed * priest.speedMult;
        priest.x += (pdx / pdist) * currentPriestSpeed * dt * 60;
        priest.y += (pdy / pdist) * currentPriestSpeed * dt * 60;
    }

    // Collision: Player vs TV
    if (tv.active) {
        let tvdx = player.x - tv.x;
        let tvdy = player.y - tv.y;
        if (Math.hypot(tvdx, tvdy) < player.r + Math.max(tv.w, tv.h)/2) {
            score++;
            scoreDisplay.innerText = score;
            priest.speedMult += 0.05; // Increase difficulty
            AudioSys.playSfx('door');
            vibrate('light');
            spawnTV();
        }
    }

    // Collision: Player vs Priest (Death)
    if (pdist < player.r + priest.r - 10) {
        setState('GAMEOVER');
    }
}

function draw() {
    // Base Dark Floor
    ctx.fillStyle = '#0a0a0c';
    ctx.fillRect(0, 0, cw, ch);

    // Draw Grid/Floor pattern faintly
    ctx.strokeStyle = '#1a1a1e';
    ctx.lineWidth = 2;
    const gridSize = 40;
    ctx.beginPath();
    for(let x = 0; x < cw; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, ch); }
    for(let y = 0; y < ch; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(cw, y); }
    ctx.stroke();

    // Draw TV (Collectible)
    if (tv.active) {
        ctx.save();
        ctx.translate(tv.x, tv.y);
        // Glow
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#222';
        ctx.fillRect(-tv.w/2, -tv.h/2, tv.w, tv.h);
        ctx.shadowBlur = 0;
        
        // Video Screen
        if (vidTele && vidTele.readyState >= 2) {
            ctx.drawImage(vidTele, -tv.w/2 + 2, -tv.h/2 + 2, tv.w - 4, tv.h - 4);
        } else {
            // Static noise fallback
            ctx.fillStyle = Math.random() > 0.5 ? '#fff' : '#444';
            ctx.fillRect(-tv.w/2 + 2, -tv.h/2 + 2, tv.w - 4, tv.h - 4);
        }
        ctx.restore();
    }

    // Draw Priest
    ctx.save();
    ctx.translate(priest.x, priest.y);
    if (imgPriest && imgPriest.complete && imgPriest.naturalWidth > 0) {
        ctx.drawImage(imgPriest, -priest.r, -priest.r * 1.5, priest.r * 2, priest.r * 3);
    } else {
        ctx.fillStyle = '#500';
        ctx.beginPath(); ctx.arc(0, 0, priest.r, 0, Math.PI*2); ctx.fill();
    }
    // Red glowing eyes
    ctx.fillStyle = '#f00';
    ctx.shadowColor = '#f00';
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(-8, -10, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -10, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // Draw Player (Boy)
    ctx.save();
    ctx.translate(player.x, player.y);
    if (imgBoy && imgBoy.complete && imgBoy.naturalWidth > 0) {
        ctx.drawImage(imgBoy, -player.r, -player.r * 1.5, player.r * 2, player.r * 3);
    } else {
        ctx.fillStyle = '#00f';
        ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();

    // Draw Darkness Overlay (Flashlight mask)
    ctx.save();
    // Heartbeat flicker effect based on proximity to priest
    let pdist = Math.hypot(player.x - priest.x, player.y - priest.y);
    let flicker = 0;
    if (pdist < 200) {
        flicker = Math.sin(Date.now() / 50) * 10 * (1 - pdist/200);
    }
    
    let currentRadius = Math.max(20, window.gameConfig.lightRadius + flicker);
    
    let g = ctx.createRadialGradient(player.x, player.y, currentRadius * 0.2, player.x, player.y, currentRadius);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.6, 'rgba(0,0,0,0.8)');
    g.addColorStop(1, 'rgba(0,0,0,0.98)');
    
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cw, ch);
    ctx.restore();
}

function gameLoop(now) {
    try {
        if (!lastTime) lastTime = now;
        const dt = Math.min((now - lastTime) / 1000, 0.05); // Cap dt
        lastTime = now;

        update(dt);
        draw();
    } catch (e) {
        console.error("Loop error", e);
    }
    requestAnimationFrame(gameLoop);
}

/**
 * Input & Setup
 */
function handleGlobalInput(e) {
    AudioSys.unlock();
    
    if (gameState === 'GAMEOVER') {
        if (e.target.id === 'restart-btn') restartGame();
        return;
    }
    
    if (gameState === 'PLAYING') {
        // Update target position
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;
        
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        
        player.targetX = clientX - rect.left;
        player.targetY = clientY - rect.top;
    }
}

function resize(width, height) {
    cw = width;
    ch = height;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (initialized) {
        player.x = Math.max(player.r, Math.min(cw - player.r, player.x));
        player.y = Math.max(player.r, Math.min(ch - player.r, player.y));
    }
}

document.addEventListener('DOMContentLoaded', () => {
    // Parse config
    try {
        const confStr = document.getElementById('game-config').textContent;
        const defs = JSON.parse(confStr);
        for (let k in defs) window.gameConfig[k] = defs[k].value;
    } catch(e) { console.warn("Config parse failed", e); }

    AudioSys.init();

    // Input bindings
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    window.addEventListener('pointermove', (e) => {
        if (e.buttons > 0) handleGlobalInput(e);
    }, { passive: false });
    
    // Prevent default touch behaviors
    document.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

    // Resize Observer (L0)
    const ro = new ResizeObserver(entries => {
        const rect = entries[0].contentRect;
        resize(rect.width, rect.height);
        
        if (!initialized) {
            initialized = true;
            initGame();
            setState('PLAYING');
            requestAnimationFrame(gameLoop);
        }
    });
    ro.observe(canvas);
});

</script>
